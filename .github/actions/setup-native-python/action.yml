# RigorFoundry — Exact CI interpreter provisioning

name: Set up exact native Python
description: Provision an isolated, exact x64 CPython with its bundled pip
inputs:
  python-version:
    description: Exact CPython patch version
    required: true
  cache:
    description: Cache backend for the hash-locked pip installation
    required: true
  cache-dependency-path:
    description: Lock files that bind the pip cache key
    required: true
runs:
  using: composite
  steps:
    - name: Provision and verify the exact interpreter
      shell: bash
      env:
        RF_PYTHON_VERSION: ${{ inputs.python-version }}
        RF_PYTHON_CACHE: ${{ inputs.cache }}
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/rigor-ci-interpreters
      run: |
        set -euo pipefail
        [[ $RUNNER_ARCH == X64 && $RF_PYTHON_CACHE == pip && $RF_PYTHON_VERSION =~ ^3\.[0-9]+\.[0-9]+$ ]]
        uv_version=0.13.7
        hash_command=(sha256sum)
        case "$RUNNER_OS" in
          Windows)
            archive_name='uv-x86_64-pc-windows-msvc.zip'
            checksum=0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021
            ;;
          macOS)
            archive_name='uv-x86_64-apple-darwin.tar.gz'
            checksum=20c47e4c1f630b8abaff8c291fa9b9aa300fef92c4fbff95adf198b55287cda7
            hash_command=(shasum -a 256)
            ;;
          Linux)
            archive_name='uv-x86_64-unknown-linux-gnu.tar.gz'
            checksum=c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
            ;;
          *)
            printf 'Unsupported uv runner OS: %s\n' "$RUNNER_OS" >&2
            exit 1
            ;;
        esac
        work_root=$RUNNER_TEMP
        if [[ $RUNNER_OS == Windows ]]; then
          work_root=$(cygpath -u "$work_root")
          bin="$work_root/rigor-ci-python/Scripts"
          python="$bin/python.exe"
        else
          bin="$work_root/rigor-ci-python/bin"
          python="$bin/python"
        fi
        uv_root=$(mktemp -d "$work_root/rigor-ci-uv.XXXXXXXX")
        trap 'rm -rf -- "$uv_root"' EXIT
        archive="$uv_root/$archive_name"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location \
          --retry 3 --connect-timeout 10 --max-time 180 --output "$archive" \
          "https://github.com/astral-sh/uv/releases/download/$uv_version/$archive_name"
        printf '%s  %s\n' "$checksum" "$archive" | "${hash_command[@]}" --check
        uv="$uv_root/uv"
        if [[ $RUNNER_OS == Windows ]]; then
          uv="$uv.exe"
          unzip -p "$archive" uv.exe > "$uv"
        else
          tar -xOzf "$archive" "${archive_name%.tar.gz}/uv" > "$uv"
        fi
        chmod u+x "$uv"
        "$uv" --version
        printf 'Verified uv archive SHA-256 %s\n' "$checksum"
        "$uv" --no-config venv --managed-python --python "cpython-$RF_PYTHON_VERSION" "$work_root/rigor-ci-python"
        "$python" -I -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert platform.python_version() == sys.argv[1]; assert platform.machine().lower() in {"amd64", "x86_64"}' "$RF_PYTHON_VERSION"
        "$python" -I -m ensurepip --default-pip
        if [[ $RUNNER_OS == Windows ]]; then
          bin=$(cygpath -w "$bin")
        fi
        printf '%s\n' "$bin" >> "$GITHUB_PATH"
        printf 'PIP_CACHE_DIR=%s/rigor-ci-pip-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      env:
        RF_PYTHON_VERSION: ${{ inputs.python-version }}
        RF_PIP_LOCKS: ${{ inputs.cache-dependency-path }}
      with:
        path: ${{ runner.temp }}/rigor-ci-pip-cache
        key: ${{ runner.os }}-${{ runner.arch }}-rigor-pip-${{ env.RF_PYTHON_VERSION }}-${{ hashFiles(env.RF_PIP_LOCKS) }}
