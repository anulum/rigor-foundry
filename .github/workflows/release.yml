# RigorFoundry — Tagged GitHub release assembly

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            requirements/bootstrap.txt
            requirements/ci.txt
            requirements/runtime.txt
      - name: Build release artifacts
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements/ci.txt
          python -m tools.check_release_tag "$GITHUB_REF_NAME"
          python -m build --no-isolation
          python -m tools.check_distribution_metadata dist/*.whl
          python -m twine check dist/*
      - name: Inventory installed release runtime
        run: |
          runtime="$RUNNER_TEMP/rigor-release-runtime"
          python -m venv --without-pip "$runtime"
          python -m pip --python "$runtime" install \
            --require-hashes --only-binary=:all: -r requirements/runtime.txt
          python -m pip --python "$runtime" install --no-index --no-deps dist/*.whl
          python -m pip --python "$runtime" check
          env -u SOURCE_DATE_EPOCH cyclonedx-py environment "$runtime/bin/python" \
            --pyproject pyproject.toml --mc-type library --sv 1.6 --output-reproducible \
            --output-file dist/rigor-foundry.cdx.json
      - name: Bind release files to source and checksums
        working-directory: dist
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          sha256sum -- *.whl *.tar.gz rigor-foundry.cdx.json SOURCE_COMMIT > SHA256SUMS
          sha256sum --strict --check SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
