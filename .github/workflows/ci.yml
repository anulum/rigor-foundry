# RigorFoundry — Deterministic quality and test gates

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci-quality.yml

  test:
    uses: ./.github/workflows/ci-tests.yml

  coverage:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-coverage.yml

  distribution:
    uses: ./.github/workflows/ci-distribution.yml

  vscode:
    uses: ./.github/workflows/ci-vscode.yml

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [quality, test, coverage, distribution, vscode]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      TEST_RESULT: ${{ needs.test.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
      VSCODE_RESULT: ${{ needs.vscode.result }}
    steps:
      - name: Require every CI category
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success
          test "$VSCODE_RESULT" = success
