name: CI test
permissions:
  contents: read
concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    env: &id001
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      RIGOR_TEST_SHARD_STRATEGY: module-lpt-v1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - 3.11.15
        - 3.12.13
        - 3.13.14
        platform:
        - win32
        - darwin
        include:
        - platform: win32
          runner: windows-latest
          test-lock: requirements/test-windows.txt
        - platform: darwin
          runner: macos-15-intel
          test-lock: requirements/test.txt
    steps:
    - &id002
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-native-python
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements/bootstrap.txt
          requirements/test.txt
          requirements/runtime.txt
          requirements/test-windows.txt
          requirements/provenance.txt
    - name: Install hash-locked native environment
      shell: bash
      run: |
        python -m pip install --require-hashes -r requirements/bootstrap.txt
        python -m pip install --require-hashes --no-build-isolation -r requirements/runtime.txt -r ${{ matrix.test-lock }} -r requirements/provenance.txt
        python -m pip install --no-build-isolation --no-deps .
        python -m pip check
    - name: Run complete source-bound native profile
      run: python -m tools.run_native_tests --role ordinary
    - name: Verify installed dependency provenance
      if: matrix.platform != 'darwin'
      run: >-
        python -m pytest -p no:cacheprovider -q
        tests/test_provenance_scan.py tests/test_provenance_attestation.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: native-python-ordinary-${{ matrix.platform }}-${{ matrix.python-version }}-${{ github.run_attempt }}
        path: .rigor-native-coverage/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  native-primary:
    env: *id001
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - *id002
    - uses: ./.github/actions/setup-native-python
      with:
        python-version: 3.12.13
        cache: pip
        cache-dependency-path: |
          requirements/bootstrap.txt
          requirements/test.txt
          requirements/runtime.txt
          requirements/test-windows.txt
    - name: Install hash-locked native environment
      shell: bash
      run: |
        python -m pip install --require-hashes -r requirements/bootstrap.txt
        python -m pip install --require-hashes --no-build-isolation -r requirements/runtime.txt -r requirements/test-windows.txt
        python -m pip install --no-build-isolation --no-deps .
        python -m pip check
    - name: Run separate required primary acceptance
      run: python -m tools.run_native_tests --role primary
    - name: Enforce complete primary test-owner coverage
      run: python -m tools.check_full_file_coverage --data-file .rigor-native-primary/.coverage tests/test_windows_bootstrap_hostile.py tests/test_windows_hostile_controls.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: native-python-primary-win32-3.12.13-${{ github.run_attempt }}
        path: .rigor-native-primary/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  native-quality:
    if: ${{ always() }}
    needs:
    - native
    - native-primary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      RIGOR_TEST_SHARD_STRATEGY: module-lpt-v1
      NATIVE_RESULT: ${{ needs.native.result }}
      PRIMARY_RESULT: ${{ needs['native-primary'].result }}
    steps:
    - name: Require complete native producers
      shell: bash
      run: 'set -euo pipefail

        test "$NATIVE_RESULT" = success

        test "$PRIMARY_RESULT" = success

        '
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.12.13
        cache: pip
        cache-dependency-path: |
          requirements/bootstrap.txt
          requirements/test.txt
          requirements/runtime.txt
    - name: Install hash-locked native qualification environment
      run: |
        python -m pip install --require-hashes -r requirements/bootstrap.txt
        python -m pip install --require-hashes --no-build-isolation -r requirements/test.txt -r requirements/runtime.txt
        python -m pip install --no-build-isolation --no-deps .
        python -m pip check
    - &id003
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: native-python-ordinary-win32-3.12.13-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rigor-native-windows
    - &id004
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: native-python-primary-win32-3.12.13-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rigor-native-primary
    - name: Qualify complete native tools and maintained tests
      shell: bash
      env:
        RIGOR_NATIVE_PRIMARY_EVIDENCE_DIR: ${{ runner.temp }}/rigor-native-primary
        RIGOR_NATIVE_WINDOWS_EVIDENCE_DIR: ${{ runner.temp }}/rigor-native-windows
      run: 'python -m pytest tests/test_run_native_tests.py tests/test_native_test_evidence.py tests/test_pytest_native_tests.py tests/test_native_coverage.py tests/test_native_test_profiles.py tests/test_ordinary_coverage.py tests/test_native_coverage_ownership.py tests/test_native_observation_identity.py --cov=tools.run_native_tests --cov=tools.native_test_evidence --cov=tools.pytest_native_tests --cov=tools.native_coverage --cov=test_run_native_tests --cov=test_native_test_evidence --cov=test_pytest_native_tests --cov=test_native_coverage --cov=tools.native_test_profiles --cov=tools.ordinary_coverage --cov=test_native_test_profiles --cov=test_ordinary_coverage --cov=test_native_coverage_ownership --cov=test_native_observation_identity --cov-branch --cov-report=term-missing --cov-fail-under=100

        python -m tools.check_full_file_coverage --data-file .coverage tools/native_test_evidence.py tools/run_native_tests.py tools/pytest_native_tests.py tools/native_coverage.py tests/test_native_test_evidence.py tests/test_run_native_tests.py tests/test_pytest_native_tests.py tests/test_native_coverage.py tools/native_test_profiles.py tools/ordinary_coverage.py tests/test_native_test_profiles.py tests/test_ordinary_coverage.py tests/test_native_coverage_ownership.py tests/test_native_observation_identity.py

        '
  test:
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      RIGOR_TEST_SHARD_STRATEGY: module-lpt-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - 3.11.15
        - 3.12.13
        - 3.13.14
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Install native audit sandbox
      run: "set -euo pipefail\npython3 -m tools.install_bubblewrap \\\n  --destination \"$RUNNER_TEMP/bubblewrap.deb\"\nsudo dpkg -i \"$RUNNER_TEMP/bubblewrap.deb\"\nsudo install -m 0644 /dev/stdin /etc/apparmor.d/bwrap <<'APPARMOR'\nabi <abi/4.0>,\ninclude <tunables/global>\n\n# Ubuntu 24.04 globally mediates unprivileged user namespaces. This\n# attachment grants userns only to the root-owned bwrap path; it does\n# not provide the native-audit sandbox. RigorFoundry's attested bwrap\n# argument contract provides that boundary and disables nested userns.\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\nAPPARMOR\nsudo apparmor_parser --replace /etc/apparmor.d/bwrap\ntest \"$(/usr/bin/cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)\" = 1\n/usr/bin/bwrap --version\n/usr/bin/dpkg-query --show \\\n  --showformat='${binary:Package}|${Version}|${Architecture}|${Status}\\n' \\\n  bubblewrap\ntest \"$(/usr/bin/dpkg-query --showformat='${Version}' --show bubblewrap)\" = \\\n  0.9.0-1ubuntu0.3\nprintf '%s  %s\\n' \\\n  e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71 \\\n  /usr/bin/bwrap | sha256sum --check --strict\n/usr/bin/bwrap --die-with-parent --new-session --unshare-all \\\n  --unshare-user --disable-userns --assert-userns-disabled \\\n  --uid 65534 --gid 65534 --ro-bind /usr /usr \\\n  --symlink usr/bin /bin --symlink usr/lib /lib \\\n  --symlink usr/lib64 /lib64 --proc /proc --dev /dev \\\n  --tmpfs /tmp --clearenv -- /usr/bin/true\nif /usr/bin/bwrap --die-with-parent --new-session --unshare-all \\\n  --unshare-user --disable-userns --assert-userns-disabled \\\n  --uid 65534 --gid 65534 --ro-bind /usr /usr \\\n  --symlink usr/bin /bin --symlink usr/lib /lib \\\n  --symlink usr/lib64 /lib64 --proc /proc --dev /dev \\\n  --tmpfs /tmp --clearenv -- \\\n  /usr/bin/unshare --user -- /usr/bin/true; then\n  echo \"nested user namespace unexpectedly succeeded\" >&2\n  exit 1\nfi\n"
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements/bootstrap.txt
          requirements/ci.txt
          requirements/test.txt
          requirements/security.txt
          requirements/semgrep.txt
          requirements/native.txt
          requirements/provenance.txt
    - name: Install hash-locked test environment
      run: |
        python -m venv "$RUNNER_TEMP/rigor-docs-venv"
        "$RUNNER_TEMP/rigor-docs-venv/bin/python" -m pip install --require-hashes -r requirements/bootstrap.txt
        "$RUNNER_TEMP/rigor-docs-venv/bin/python" -m pip install --require-hashes --no-build-isolation -r requirements/ci.txt
        python -m pip install --require-hashes -r requirements/bootstrap.txt
        python -m pip install --require-hashes --no-build-isolation -r requirements/test.txt -r requirements/provenance.txt
        python -m pip install --require-hashes --no-build-isolation -r requirements/security.txt
        python -m pip install --require-hashes --no-build-isolation -r requirements/native.txt
        python -m pip install --no-build-isolation --no-deps .
        python -m venv "$pythonLocation/rigor-semgrep-venv"
        "$pythonLocation/rigor-semgrep-venv/bin/python" -m pip install --require-hashes -r requirements/bootstrap.txt
        "$pythonLocation/rigor-semgrep-venv/bin/python" -m pip install --require-hashes --no-build-isolation -r requirements/semgrep.txt
        install -m 0755 "$pythonLocation/rigor-semgrep-venv/bin/semgrep" "$pythonLocation/rigor-semgrep-venv/bin/pysemgrep" "$pythonLocation/bin/"
        python -m tools.check_semgrep_isolation
        python -m tools.install_buildx --destination "$pythonLocation/bin/docker-buildx"
        python -m tools.install_typos
        python -m tools.install_trivy
        python -m tools.install_osv_scanner
    - *id003
    - *id004
    - name: Fetch the pinned SARIF schema
      shell: bash
      run: |
        set -euo pipefail
        schema="$RUNNER_TEMP/sarif-schema-2.1.0.json"
        curl --proto '=https' --tlsv1.2 --fail --location --output "$schema" "$(python -m tools.sarif_schema_pin url)"
        printf '%s  %s\n' "$(python -m tools.sarif_schema_pin sha256)" "$schema" | sha256sum --check --strict
    - name: Run exhaustive CI-owned suite
      env:
        RIGOR_DOCUMENTATION_PYTHON: ${{ runner.temp }}/rigor-docs-venv/bin/python
        RIGOR_SARIF_SCHEMA_PATH: ${{ runner.temp }}/sarif-schema-2.1.0.json
        RIGOR_NATIVE_PRIMARY_EVIDENCE_DIR: ${{ runner.temp }}/rigor-native-primary
        RIGOR_NATIVE_WINDOWS_EVIDENCE_DIR: ${{ runner.temp }}/rigor-native-windows
      run: python -m tools.run_test_shard --index ${{ matrix.shard }} --count 8
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: test-shard-${{ matrix.python-version }}-${{ github.run_attempt }}-${{ matrix.shard }}
        path: .rigor-test-shard/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
    needs:
    - native
    - native-primary
  test-coverage:
    needs:
    - native
    - native-primary
    - native-quality
    - test
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      RIGOR_TEST_SHARD_STRATEGY: module-lpt-v1
      TEST_RESULT: ${{ needs.test.result }}
      NATIVE_RESULT: ${{ needs.native.result }}
      NATIVE_QUALITY_RESULT: ${{ needs['native-quality'].result }}
      PRIMARY_RESULT: ${{ needs['native-primary'].result }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - 3.11.15
        - 3.12.13
        - 3.13.14
    steps:
    - name: Require complete interpreter and native producers
      shell: bash
      run: 'set -euo pipefail

        test "$TEST_RESULT" = success

        test "$NATIVE_RESULT" = success

        test "$NATIVE_QUALITY_RESULT" = success

        test "$PRIMARY_RESULT" = success

        '
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements/bootstrap.txt
          requirements/ci.txt
    - name: Install hash-locked coverage environment
      run: |
        python -m pip install --require-hashes -r requirements/bootstrap.txt
        python -m pip install --require-hashes --no-build-isolation -r requirements/ci.txt
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: test-shard-${{ matrix.python-version }}-${{ github.run_attempt }}-*
        path: test-shards
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: native-python-ordinary-*-${{ matrix.python-version }}-${{ github.run_attempt }}
        path: native-data
    - name: Combine complete interpreter coverage
      shell: bash
      run: "set -euo pipefail\nfor index in 0 1 2 3 4 5 6 7; do\n  mv \"test-shards/test-shard-${{ matrix.python-version }}-${{ github.run_attempt }}-$index\" \"test-shards/shard-$index\"\ndone\nfor platform in win32 darwin; do\n  mv \"native-data/native-python-ordinary-$platform-${{ matrix.python-version }}-${{ github.run_attempt }}\" \"native-data/$platform\"\ndone\npython -m tools.combine_test_shards --directory test-shards --count 8 --native-directory native-data\n"
    - name: Enforce exact native dispatch coverage
      run: python -m coverage report --include='*/native_dispatch.py' --fail-under=100
    - name: Enforce complete native backend and maintained-test coverage
      if: matrix.python-version == '3.12.13'
      shell: bash
      run: "set -euo pipefail\nordinary=()\nfor path in tests/test_windows_*.py; do\n  case \"$path\" in\n    tests/test_windows_bootstrap_hostile.py|tests/test_windows_hostile_controls.py) ;;\n    *) ordinary+=(\"$path\") ;;\n  esac\ndone\npython -m tools.check_full_file_coverage --data-file .coverage   src/rigor_foundry/windows_abi.py src/rigor_foundry/windows_bootstrap.py   src/rigor_foundry/windows_directory_inventory.py   src/rigor_foundry/windows_file_io.py src/rigor_foundry/windows_git.py   src/rigor_foundry/windows_handles.py src/rigor_foundry/windows_ignored_inventory.py   src/rigor_foundry/windows_permissions.py   src/rigor_foundry/windows_process.py src/rigor_foundry/bootstrap.py   src/rigor_foundry/git_provenance.py src/rigor_foundry/git_inventory.py   src/rigor_foundry/stable_reads.py   src/rigor_foundry/ignored_inventory.py   src/rigor_foundry/internal_storage.py src/rigor_foundry/safe_output.py   tests/test_darwin_git_trust.py   \"${ordinary[@]}\"\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: matrix.python-version == '3.12.13'
      with:
        name: coverage-python-3.12
        path: coverage.xml
        if-no-files-found: error
        retention-days: 14
    if: ${{ always() }}
'on':
  workflow_call:
