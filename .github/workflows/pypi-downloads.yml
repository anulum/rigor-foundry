# RigorFoundry — daily PyPI download snapshot on the bounded metrics branch

name: PyPI downloads

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-downloads-metrics
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Prepare the bounded metrics snapshot
        id: snapshot
        env:
          METRICS_DIR: ${{ runner.temp }}/rigor-foundry-metrics
        run: |
          set -euo pipefail
          readonly package="rigor-foundry"
          readonly csv_path="downloads/rigor-foundry.csv"
          detected="$(python tools/pypi_downloads.py --print-package)"
          test "$detected" = "$package"
          remote="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin metrics >/dev/null 2>&1; then
            git clone --depth 1 --branch metrics "$remote" "$METRICS_DIR"
          else
            mkdir -p "$METRICS_DIR"
            git -C "$METRICS_DIR" init --initial-branch=metrics
            git -C "$METRICS_DIR" remote add origin "$remote"
          fi

          cd "$METRICS_DIR"
          python "$GITHUB_WORKSPACE/tools/pypi_downloads.py" \
            --package "$package" \
            --csv "$csv_path" \
            --project-csv-only
          if test ! -f "$csv_path"; then
            echo "csv_present=false" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "csv_present=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$csv_path"

          mapfile -t tracked_paths < <(git ls-files)
          test "${#tracked_paths[@]}" -eq 1
          test "${tracked_paths[0]}" = "$csv_path"
          if git diff --cached --quiet; then
            echo "No download changes to record."
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit \
            --message "metrics: pypi download snapshot for ${package}"
          echo "push=true" >> "$GITHUB_OUTPUT"
      - name: Upload the exact download series
        if: steps.snapshot.outputs.csv_present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rigor-foundry-pypi-downloads
          path: ${{ runner.temp }}/rigor-foundry-metrics/downloads/rigor-foundry.csv
          if-no-files-found: error
          retention-days: 14
      - name: Push the metrics commit
        if: steps.snapshot.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_DIR: ${{ runner.temp }}/rigor-foundry-metrics
        run: |
          set -euo pipefail
          cd "$METRICS_DIR"
          askpass_path="$RUNNER_TEMP/rigor-foundry-git-askpass"
          trap 'rm -f "$askpass_path"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            "case \"\$1\" in" \
            "*Username*) printf '%s\\n' git ;;" \
            "*) printf '%s\\n' \"\$GH_TOKEN\" ;;" \
            'esac' > "$askpass_path"
          chmod 700 "$askpass_path"
          GIT_ASKPASS="$askpass_path" GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:refs/heads/metrics
