# RigorFoundry — upload the repository self-audit to GitHub code scanning

name: Code scanning

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.12.13
      - name: Install the hash-locked runtime
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements/runtime.txt
      - name: Scan this exact checkout
        run: python -m rigor_foundry scan --root . --policy rigor-foundry-policy.json --json-out "$RUNNER_TEMP/rigor-report.json"
      - name: Require the checkout to be the report's commit
        run: python -m tools.check_sarif_upload_checkout "$RUNNER_TEMP/rigor-report.json" --root .
      - name: Write the GitHub code-scanning profile
        run: python -m rigor_foundry sarif --report "$RUNNER_TEMP/rigor-report.json" --profile github-code-scanning --output "$RUNNER_TEMP/rigor-foundry.sarif"
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          sarif_file: ${{ runner.temp }}/rigor-foundry.sarif
          category: rigor-foundry
