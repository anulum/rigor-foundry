# RigorFoundry — Local, lock-backed Git hooks

minimum_pre_commit_version: 4.6.0
default_install_hook_types: [pre-commit, pre-push, commit-msg]
repos:
  - repo: local
    hooks:
      - id: headers
        name: canonical Apache-2.0 headers
        entry: .venv/bin/python -m tools.check_headers
        language: system
        pass_filenames: false
      - id: action-pins
        name: immutable GitHub Action pins
        entry: .venv/bin/python -m tools.check_action_pins
        language: system
        pass_filenames: false
      - id: descriptive-production-naming
        name: descriptive production naming
        entry: .venv/bin/python -m tools.check_descriptive_production_naming
        language: system
        pass_filenames: false
      - id: metadata
        name: release metadata consistency
        entry: .venv/bin/python -m tools.check_metadata
        language: system
        pass_filenames: false
      - id: secrets
        name: redaction-safe secret scan
        entry: .venv/bin/python -m tools.check_secrets
        language: system
        pass_filenames: false
      - id: project-memory-privacy
        name: private project memory boundary
        entry: .venv/bin/python -m tools.check_project_memory_privacy --allow-absent
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Ruff lint
        entry: .venv/bin/python -m ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff formatting
        entry: .venv/bin/python -m ruff format --check
        language: system
        types_or: [python, pyi]
      - id: memory-test-documentation
        name: memory preparation test documentation
        entry: >-
          .venv/bin/python -m ruff check --config 'lint.per-file-ignores={}'
          tests/test_project_memory_activation_artifact.py
          tests/test_project_memory_activation_plan.py
          tests/project_memory_store_support.py
          tests/test_project_memory_store.py
          tests/test_project_memory_reader.py
          tests/test_project_memory_history.py
          tests/test_project_memory_filesystem_safety.py
          tests/test_project_registry_cutover.py
          tests/test_project_memory_activation_content.py
          tests/test_project_memory_activation_publication.py
          tests/test_project_memory_sources.py
          tests/test_protected_file_publication.py
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: strict MyPy
        entry: .venv/bin/python -m mypy --strict src/rigor_foundry tools
        language: system
        pass_filenames: false
      - id: discovery-test-documentation
        # This cohort retains docstrings despite the legacy test exemption.
        name: discovery source test documentation
        entry: >-
          .venv/bin/python -m ruff check --config 'lint.per-file-ignores={}'
          tests/discovery_source_support.py
          tests/test_discovery_source_validation.py
          tests/test_discovery_source_boundaries.py
          tests/test_discovery_source_cli.py
        language: system
        pass_filenames: false
        always_run: true
      - id: discovery-strict-typing
        name: discovery source strict typing
        entry: >-
          .venv/bin/python -m mypy --strict
          src/rigor_foundry/discovery_source_schema.py
          src/rigor_foundry/discovery_source_validation.py
          src/rigor_foundry/discovery_source_cli.py
          tests/discovery_source_support.py
          tests/test_discovery_source_validation.py
          tests/test_discovery_source_boundaries.py
          tests/test_discovery_source_cli.py
        language: system
        pass_filenames: false
        always_run: true
      - id: preflight-fast
        name: bounded pre-push preflight
        entry: .venv/bin/python -m tools.preflight --fast
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: commit-message
        name: commit attribution policy
        entry: .venv/bin/python -m tools.check_commit_message
        language: system
        stages: [commit-msg]
