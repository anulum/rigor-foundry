# RigorFoundry — Typo checker configuration

[default]
# Exact command and switch spellings, not prose typos:
# the shadow-utils `chage` account-ageing command in the container hardening step,
# and the Windows `whoami /fo csv` output-format switch.
extend-ignore-re = [
  "chage --lastday",
  '"/fo"',
]

[default.extend-words]
argv = "argv"
gitlink = "gitlink"
unparseable = "unparseable"
uncatalogued = "uncatalogued"
"Šotek" = "Šotek"
