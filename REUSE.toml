# RigorFoundry — REUSE configuration

version = 1

[[annotations]]
path = [
    "*.md",
    "*.txt",
    "COPYRIGHT",
    ".github/**/*.md",
    "docs/**/*.md",
    "docs/assets/*",
    "LICENSES/Apache-2.0.txt",
    "NOTICE",
    "requirements/*.txt",
    "src/rigor_foundry/py.typed",
    "tests/fixtures/provenance/README.md",
]
SPDX-FileCopyrightText = "1996-2026 Miroslav Šotek"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    ".zenodo.json",
    ".github/**/*.json",
    "coverage-residuals.json",
    "module-size-decisions.json",
    "rigor-public-api.json",
    "rigor-foundry-policy.json",
    "src/rigor_foundry/cwe_mapping.json",
    "tests/fixtures/sarif/*",
]
SPDX-FileCopyrightText = "1996-2026 Miroslav Šotek"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["tests/fixtures/lockfiles/*/*", "tests/fixtures/lockfiles/report-golden.json"]
SPDX-FileCopyrightText = "1996-2026 Miroslav Šotek"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["tests/fixtures/sarif_import/*.sarif", "tests/fixtures/sarif_import/producer-repository.json", "tests/fixtures/sarif_import/semgrep-1.186.0-sandboxed-json-stdout.json"]
